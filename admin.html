<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Admin</title><link rel="stylesheet" href="/css/global.css"/><link rel="stylesheet" href="/css/admin.css"/></head><body><main><section id="login" class="glass"><h1>Admin Login</h1><input id="user" placeholder="Username"/><input id="pass" type="password" placeholder="Password"/><button id="login-btn" class="cta">Login</button><p class="hint">Default: admin / changeme-now</p></section><section id="dashboard" class="hidden"><header class="glass"><h1>Control Center</h1><button id="logout">Logout</button></header><div class="admin-grid"><article class="glass"><h2>Products</h2><form id="product-form"><input name="name" placeholder="Name" required/><input name="price" type="number" step="0.01" placeholder="Price" required/><input name="category" placeholder="Category" required/><button class="cta">Save Product</button></form><div id="product-list"></div></article><article class="glass"><h2>Coupons</h2><form id="coupon-form"><input name="code" placeholder="Code" required/><input name="type" placeholder="percent/fixed" required/><input name="value" type="number" step="0.01" required/><input name="limit" type="number" required/><button class="cta">Save Coupon</button></form><div id="coupon-list"></div></article><article class="glass"><h2>Blog</h2><form id="post-form"><input name="title" required placeholder="Title"/><textarea name="body" required placeholder="Body"></textarea><button class="cta">Publish</button></form><div id="post-list"></div></article></div></section></main><script type="module" src="/js/admin.js"></script></body></html>
